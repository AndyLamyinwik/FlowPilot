[project]
name = "flowpilot-backend"
version = "0.1.0"
description = "FlowPilot Phase 01 API foundation"
requires-python = ">=3.12"
dependencies = [
    "apscheduler==3.11.3",
    "fastapi==0.162.0",
    "httpx2==2.16.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
